name: Publish

on:
  push:
    tags:
      - "flex-url-v*"
      - "flex-url-php-v*"

permissions:
  contents: write # softprops/action-gh-release needs write to create releases
  id-token: write # OIDC token for npm trusted publishing

jobs:
  # Trusted publishing needs npm >=11.5.1 and Node >=22.14.0 (setup-node's
  # bundled npm on Node 20 predates OIDC support); staged publishing (this
  # trusted publisher has "npm publish" unchecked, "npm stage publish" only)
  # raises that floor to npm >=11.15.0. The workflow filename here must also
  # match the "publish.yml" configured as the package's trusted publisher on
  # npmjs.com exactly. `npm stage publish` succeeding only means the version
  # is queued — a maintainer still has to approve it with 2FA (CLI
  # `npm stage approve` or the npmjs.com "Staged Packages" tab) before it's
  # actually installable.
  js:
    if: startsWith(github.ref_name, 'flex-url-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js

    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 🏗 Update npm
        run: npm install -g npm@latest

      - name: 📦 Install dependencies
        working-directory: .
        run: npm ci

      - name: 🏗 Build
        run: npm run build

      - name: 🧪 Test
        run: npm run test

      - name: 🚀 Stage publish to npm
        run: npm stage publish --access public --tag next

      - name: 🏗 Get release info
        id: query-release-info
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: latest
          changelog: packages/js/CHANGELOG.md

      - name: 🚀 Publish to GitHub releases
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.query-release-info.outputs.release-notes }}
          make_latest: true

  # Packagist watches the read-only open-southeners/flex-url-php split (not
  # this monorepo) and auto-updates from its own GitHub webhook whenever that
  # split repo gets a new tag — so this job's only jobs are producing that
  # split/tag and this monorepo's GitHub release from packages/php/CHANGELOG.md.
  php:
    if: startsWith(github.ref_name, 'flex-url-php-v')
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🏗 Get release info
        id: query-release-info
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: latest
          changelog: packages/php/CHANGELOG.md

      - name: 🚀 Split packages/php and push to flex-url-php
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
          VERSION: ${{ steps.query-release-info.outputs.version }}
        run: |
          git subtree split --prefix=packages/php -b split-php
          git push "https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/open-southeners/flex-url-php.git" split-php:main --force
          git push "https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/open-southeners/flex-url-php.git" "split-php:refs/tags/v${VERSION}" --force

      - name: 🚀 Publish to GitHub releases
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.query-release-info.outputs.release-notes }}
          make_latest: true
